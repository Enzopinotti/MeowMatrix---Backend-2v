name: Meow modern full-stack runtime

on:
  pull_request:
    paths:
      - "modern/**"
      - "integration/**"
      - "docs/modernization-2026/**"
      - ".nvmrc"
      - ".gitignore"
      - ".github/workflows/modern-*.yml"
  push:
    branches:
      - main
    paths:
      - "modern/**"
      - "integration/**"
      - "docs/modernization-2026/**"
      - ".nvmrc"
      - ".gitignore"
      - ".github/workflows/modern-*.yml"

permissions:
  contents: read

jobs:
  full-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: meow-b6
      MEOW_API_ORIGIN: http://127.0.0.1:18080
      MEOW_WEB_ORIGIN: http://127.0.0.1:14173
      MEOW_MAILPIT_ORIGIN: http://127.0.0.1:18025
      MEOW_REGISTRY_IMAGE: registry:3.1.1@sha256:1be55279f18a2fe1a74edf2664cac61c1bea305b7b4642dab412e7affdcb3e33

    steps:
      - name: Check out backend repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Prepare pinned frontend source
        run: bash integration/prepare-frontend.sh

      - name: Validate Compose topology
        run: docker compose -f integration/compose.b6.yml config --quiet

      - name: Pull pinned runtime dependency images
        run: docker compose -f integration/compose.b6.yml pull mongo mailpit

      - name: Build pinned full-stack images
        run: docker compose -f integration/compose.b6.yml build --pull

      - name: Record exact release candidate evidence
        run: bash integration/release-evidence.sh

      - name: Start full-stack runtime
        run: docker compose -f integration/compose.b6.yml up -d --wait --wait-timeout 120

      - name: Run transactional and persistence smoke
        run: bash integration/full-stack-smoke.sh

      - name: Run target data preflight
        run: docker compose -f integration/compose.b6.yml exec -T -e DATA_PREFLIGHT_MODE=target api node dist/data-preflight.js

      - name: Exercise public smoke and evidence contract locally
        env:
          MEOW_PUBLIC_WEB_ORIGIN: http://127.0.0.1:14173
          MEOW_PUBLIC_API_ORIGIN: http://127.0.0.1:18080
          MEOW_PUBLIC_API_VERSION: "2026-b7"
          MEOW_PUBLIC_ALLOW_HTTP: "true"
          MEOW_PUBLIC_EVIDENCE_PATH: .runtime/external-qualification/local-evidence.json
        shell: bash
        run: |
          set -euo pipefail
          export MEOW_EVIDENCE_BACKEND_SHA="$(git rev-parse HEAD)"
          export MEOW_EVIDENCE_FRONTEND_SHA="$(tr -d '[:space:]' < integration/frontend-ref.txt)"
          bash integration/public-smoke.sh
          node -e '
          const fs=require("node:fs");
          const j=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
          if(j.schemaVersion!=="meow-external-qualification-v1"||j.result!=="success")process.exit(1);
          if(j.backendSha!==process.argv[2]||j.frontendSha!==process.argv[3])process.exit(2);
          if(j.apiVersion!=="2026-b7")process.exit(3);
          if(!/^[0-9a-f-]{36}$/.test(j.requestId??""))process.exit(4);
          ' .runtime/external-qualification/local-evidence.json "$MEOW_EVIDENCE_BACKEND_SHA" "$MEOW_EVIDENCE_FRONTEND_SHA"

      - name: Package qualified application images without rebuild
        run: bash integration/package-release-bundle.sh

      - name: Print qualified runtime evidence before teardown
        if: always()
        run: |
          if [ -f .runtime/release/candidate.json ]; then
            cat .runtime/release/candidate.json
          fi
          if [ -f .runtime/external-qualification/local-evidence.json ]; then
            cat .runtime/external-qualification/local-evidence.json
          fi
          if [ -f .runtime/release-bundle/release-bundle.json ]; then
            cat .runtime/release-bundle/release-bundle.json
          fi
          docker compose -f integration/compose.b6.yml ps || true
          docker compose -f integration/compose.b6.yml logs --no-color --tail=300 || true

      - name: Stop qualified runtime before destructive bundle reload proof
        run: docker compose -f integration/compose.b6.yml down --volumes --remove-orphans --timeout 10

      - name: Reload and smoke exact application images from bundle
        env:
          MEOW_RELEASE_VERIFY_REMOVE_EXISTING: "true"
        run: bash integration/verify-release-bundle.sh

      - name: Start pinned isolated registry
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$MEOW_REGISTRY_IMAGE"
          docker run -d --rm --name meow-registry-ci \
            -p 127.0.0.1:15000:5000 \
            "$MEOW_REGISTRY_IMAGE" >/dev/null
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:15000/v2/ >/dev/null; then
              exit 0
            fi
            if [[ "$attempt" == "30" ]]; then
              docker logs meow-registry-ci || true
              exit 1
            fi
            sleep 1
          done

      - name: Promote bundle to registry and prove pull-by-digest
        env:
          MEOW_REGISTRY_HOST: 127.0.0.1:15000
          MEOW_REGISTRY_NAMESPACE: meow-ci
          MEOW_REGISTRY_ALLOW_HTTP: "true"
          MEOW_REGISTRY_EVIDENCE_PATH: .runtime/registry-promotion/local-evidence.json
        run: bash integration/promote-release-bundle.sh

      - name: Validate local registry promotion evidence
        shell: bash
        run: |
          set -euo pipefail
          node -e '
          const fs=require("node:fs");
          const j=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
          const digest=/^sha256:[a-f0-9]{64}$/;
          if(j.schemaVersion!=="meow-registry-promotion-v1")process.exit(1);
          if(j.backendSha!==process.argv[2]||j.frontendSha!==process.argv[3])process.exit(2);
          if(!digest.test(j.images?.api?.digest??"")||!digest.test(j.images?.web?.digest??""))process.exit(3);
          if(j.proof?.rebuilt!==false||j.proof?.pulledByDigest!==true||j.proof?.exactImageIdsPreserved!==true||j.proof?.hardenedSmokePassed!==true)process.exit(4);
          ' .runtime/registry-promotion/local-evidence.json \
            "$(git rev-parse HEAD)" \
            "$(tr -d '[:space:]' < integration/frontend-ref.txt)"

      - name: Publish immutable release bundle from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meow-release-bundle-${{ github.sha }}
          path: .runtime/release-bundle/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          compression-level: 0

      - name: Publish registry rehearsal evidence from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meow-registry-rehearsal-${{ github.sha }}
          path: .runtime/registry-promotion/local-evidence.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Write release chain summary
        if: always() && hashFiles('.runtime/release-bundle/release-bundle.json') != ''
        shell: bash
        run: |
          {
            echo '## Meow immutable release chain'
            echo
            echo '### Bundle'
            echo '```json'
            cat .runtime/release-bundle/release-bundle.json
            echo '```'
            echo
            echo '```text'
            cat .runtime/release-bundle/SHA256SUMS
            echo '```'
            if [ -f .runtime/registry-promotion/local-evidence.json ]; then
              echo
              echo '### Registry promotion rehearsal'
              echo '```json'
              cat .runtime/registry-promotion/local-evidence.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tear down isolated runtime
        if: always()
        run: |
          docker rm -f meow-registry-ci >/dev/null 2>&1 || true
          docker rm -f $(docker ps -aq --filter 'name=meow-bundle-' --filter 'name=meow-registry-') >/dev/null 2>&1 || true
          docker compose -f integration/compose.b6.yml down --volumes --remove-orphans --timeout 10 || true
