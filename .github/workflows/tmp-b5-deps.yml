name: Temporary B5 dependencies

on:
  push:
    branches:
      - feat/modern-b5-private-files-delivery

permissions:
  contents: write

jobs:
  deps:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feat/modern-b5-private-files-delivery
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: modern/package-lock.json
      - working-directory: modern
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-exact multer@2.4.0
          npm install --save-dev --save-exact @types/multer@2.2.0
          npm audit --omit=dev --audit-level=high
      - name: Commit locked dependency graph
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-b5-deps.yml
          git add modern/package.json modern/package-lock.json .github/workflows/tmp-b5-deps.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(b5): add locked multipart parser"
          git push origin HEAD:feat/modern-b5-private-files-delivery
