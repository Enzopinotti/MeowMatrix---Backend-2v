name: Temporary B3 runtime finalizer

on:
  push:
    branches:
      - feat/modern-b3-auth-runtime

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: modern/package-lock.json

      - name: Install exact B3 runtime dependencies
        working-directory: modern
        run: npm install --save-exact bcryptjs@3.0.3 mongodb@7.6.0 nodemailer@10.0.10

      - name: Apply deterministic B3 finalization
        run: node .github/scripts/tmp-b3-finalize.mjs

      - name: Format maintained authority
        working-directory: modern
        run: npm exec -- prettier --write src test

      - name: Run full modern check
        working-directory: modern
        run: npm run check

      - name: Commit deterministic runtime output
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add modern/package.json modern/package-lock.json modern/src modern/test
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: finalize B3 auth runtime"
          git push origin HEAD:feat/modern-b3-auth-runtime
