name: Temporary B3 runtime finalizer

on:
  push:
    branches:
      - feat/modern-b3-auth-runtime

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: modern/package-lock.json

      - name: Install exact B3 runtime dependencies
        working-directory: modern
        run: npm install --save-exact bcryptjs@3.0.3 mongodb@7.6.0 nodemailer@10.0.10

      - name: Restore B2 Product response schema
        working-directory: modern
        run: python3 -c 'from pathlib import Path; p=Path("src/api/openapi.ts"); s=p.read_text(); old="          \"200\": { description: \"Product\" },"; new="          \"200\": {\n            description: \"Product\",\n            content: {\n              \"application/json\": {\n                schema: {\n                  type: \"object\",\n                  required: [\"data\"],\n                  properties: { data: { \$ref: \"#/components/schemas/Product\" } },\n                },\n              },\n            },\n          },"; assert old in s; p.write_text(s.replace(old,new,1))'

      - name: Align login OpenAPI with legacy-compatible parser
        working-directory: modern
        run: python3 -c 'from pathlib import Path; p=Path("src/api/openapi.ts"); s=p.read_text(); a=s.index("      LoginRequest: {"); b=s.index("      PasswordResetRequest: {",a); block=s[a:b]; old="            minLength: 12,\n            maxLength: 128,"; new="            minLength: 1,\n            maxLength: 4096,"; assert old in block; p.write_text(s[:a]+block.replace(old,new,1)+s[b:])'

      - name: Remove secret-discard lint ambiguity
        working-directory: modern
        run: python3 -c 'from pathlib import Path; p=Path("src/domain/auth.ts"); s=p.read_text(); old="function publicUser(user: AuthUserRecord): UserDto {\n  const { passwordHash: _passwordHash, ...safeUser } = user;\n  return safeUser;\n}"; new="function publicUser(user: AuthUserRecord): UserDto {\n  return {\n    id: user.id,\n    name: user.name,\n    lastName: user.lastName,\n    email: user.email,\n    role: user.role,\n    avatarUrl: user.avatarUrl,\n  };\n}"; assert old in s; p.write_text(s.replace(old,new,1))'

      - name: Format maintained authority
        working-directory: modern
        run: npm exec -- prettier --write src test

      - name: Run full modern check
        working-directory: modern
        run: npm run check

      - name: Commit deterministic runtime output
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add modern/package.json modern/package-lock.json modern/src modern/test
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: finalize B3 auth runtime"
          git push origin HEAD:feat/modern-b3-auth-runtime
