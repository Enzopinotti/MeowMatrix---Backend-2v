name: Temporary B7 formatter apply

on:
  pull_request:
    paths:
      - "modern/src/persistence/mongo-rate-limit.ts"
      - "modern/test/config.test.ts"
      - "modern/test/rate-limit.test.ts"
      - ".github/workflows/tmp-b7-format.yml"

permissions:
  contents: write

jobs:
  format-apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: modern
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: modern/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Apply and commit canonical files
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write src/persistence/mongo-rate-limit.ts test/config.test.ts test/rate-limit.test.ts
          if git diff --quiet -- src/persistence/mongo-rate-limit.ts test/config.test.ts test/rate-limit.test.ts; then
            echo "Formatter output is already canonical."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/persistence/mongo-rate-limit.ts test/config.test.ts test/rate-limit.test.ts
          git commit -m "style(b7): apply canonical formatter output"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
