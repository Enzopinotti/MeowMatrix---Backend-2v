name: Temporary B7 carrier finalizer

on:
  push:
    branches:
      - feat/modern-b7-migration-cutover-contract

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out carrier branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feat/modern-b7-migration-cutover-contract

      - name: Patch reviewed carrier semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          data = Path('modern/src/data-preflight.ts')
          text = data.read_text()
          text = text.replace(
          '''  topology: {\n    transactionCapable: true;\n    kind: "replicaSet" | "mongos";\n    sessions: true;\n  };''',
          '''  topology: {\n    transactionCapable: boolean;\n    kind: "replicaSet" | "mongos" | "standalone";\n    sessions: boolean;\n  };''')
          text = text.replace(
          '''    if (transactionKind === null) {\n      throw new Error(\n        "Mongo topology is not transaction-capable; replica set or mongos is required",\n      );\n    }\n    if (typeof hello.logicalSessionTimeoutMinutes !== "number") {\n      throw new Error("Mongo topology does not advertise logical sessions");\n    }''',
          '''    const hasSessions =\n      typeof hello.logicalSessionTimeoutMinutes === "number";\n    if (mode === "target" && transactionKind === null) {\n      throw new Error(\n        "Mongo target topology is not transaction-capable; replica set or mongos is required",\n      );\n    }\n    if (mode === "target" && !hasSessions) {\n      throw new Error("Mongo target topology does not advertise logical sessions");\n    }''')
          text = text.replace(
          '''      topology: {\n        transactionCapable: true,\n        kind: transactionKind,\n        sessions: true,\n      },''',
          '''      topology: {\n        transactionCapable: transactionKind !== null && hasSessions,\n        kind: transactionKind ?? "standalone",\n        sessions: hasSessions,\n      },''')
          data.write_text(text)

          smoke = Path('integration/public-smoke.sh')
          text = smoke.read_text()
          text = text.replace(
          '''allow_http="${MEOW_PUBLIC_ALLOW_HTTP:-false}"\n''',
          '''allow_http="${MEOW_PUBLIC_ALLOW_HTTP:-false}"\napi_version="${MEOW_PUBLIC_API_VERSION:-}"\n\nif [ -z "$api_version" ]; then\n  echo "MEOW_PUBLIC_API_VERSION is required" >&2\n  exit 2\nfi\n''')
          text = text.replace(
          '''grep -Fq '\"version\":\"2026-b7\"' "$tmp/api-health.body"''',
          '''node -e '\nconst fs=require("node:fs");const j=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));\nif(j.version!==process.argv[2])process.exit(1);\n' "$tmp/api-health.body" "$api_version"''')
          smoke.write_text(text)

          docs = Path('docs/modernization-2026/b7-migration-cutover.md')
          text = docs.read_text()
          text = text.replace(
          '''The current CLI also records Mongo topology/session capability. A source failing the required connectivity/topology contract must be handled explicitly in the provider-specific migration plan rather than silently copied through an unqualified path.''',
          '''The CLI records Mongo topology/session capability for evidence, but source mode deliberately does not require a replica set or logical sessions: a historical standalone source may still be read and migrated. Transaction/session capability becomes a fail-closed requirement only in target mode.''')
          text = text.replace(
          '''MEOW_PUBLIC_API_ORIGIN=https://api.example.com \\\nbash integration/public-smoke.sh''',
          '''MEOW_PUBLIC_API_ORIGIN=https://api.example.com \\\nMEOW_PUBLIC_API_VERSION=2026-b7 \\\nbash integration/public-smoke.sh''')
          text = text.replace(
          '''HTTP is rejected by default. `MEOW_PUBLIC_ALLOW_HTTP=true` exists only so permanent CI can exercise the same script against the isolated local topology.''',
          '''HTTP is rejected by default. `MEOW_PUBLIC_API_VERSION` is mandatory so the smoke is bound to the promoted API contract instead of a hardcoded repository version. `MEOW_PUBLIC_ALLOW_HTTP=true` exists only so permanent CI can exercise the same script against the isolated local topology.''')
          docs.write_text(text)
          PY

      - name: Install formatter
        working-directory: modern
        run: npm ci --ignore-scripts

      - name: Format maintained files
        working-directory: modern
        run: npx prettier --write src/cutover-manifest.ts src/data-preflight.ts test/cutover-manifest.test.ts

      - name: Commit finalizer output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modern/src/data-preflight.ts modern/src/cutover-manifest.ts modern/test/cutover-manifest.test.ts integration/public-smoke.sh docs/modernization-2026/b7-migration-cutover.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No finalizer changes required"
            exit 0
          fi
          git commit -m "fix: finalize B7 migration cutover contracts"
          git push origin HEAD:feat/modern-b7-migration-cutover-contract
