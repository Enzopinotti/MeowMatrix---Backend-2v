name: Meow external registry promotion

on:
  workflow_dispatch:
    inputs:
      bundle_run_id:
        description: Full-stack main run ID that published the immutable release bundle
        required: true
        type: string
      backend_sha:
        description: Full 40-character backend SHA contained in main
        required: true
        type: string
      bundle_manifest_sha256:
        description: Expected SHA-256 of release-bundle.json
        required: true
        type: string
      bundle_archive_sha256:
        description: Expected SHA-256 of meow-app-images.tar
        required: true
        type: string
      registry_host:
        description: Registry host[:port] without scheme or path
        required: true
        type: string
      registry_namespace:
        description: Lowercase registry repository prefix
        required: true
        default: meow
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: meow-registry-promotion-${{ inputs.backend_sha }}-${{ inputs.registry_host }}-${{ inputs.registry_namespace }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REGISTRY_USERNAME: ${{ secrets.MEOW_REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.MEOW_REGISTRY_PASSWORD }}

    steps:
      - name: Check out exact backend candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.backend_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify candidate is a merged main authority
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${{ inputs.backend_sha }}" =~ ^[a-f0-9]{40}$ ]]; then
            echo 'backend_sha must be a full lowercase Git SHA' >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "${{ inputs.backend_sha }}"
          git fetch origin main
          git merge-base --is-ancestor "${{ inputs.backend_sha }}" origin/main
          pinned_frontend="$(tr -d '[:space:]' < integration/frontend-ref.txt)"
          [[ "$pinned_frontend" =~ ^[a-f0-9]{40}$ ]]

      - name: Download retained immutable bundle from main run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: meow-release-bundle-${{ inputs.backend_sha }}
          path: .runtime/release-bundle
          github-token: ${{ github.token }}
          run-id: ${{ inputs.bundle_run_id }}

      - name: Verify retained bundle chain of custody
        shell: bash
        run: |
          set -euo pipefail
          manifest=.runtime/release-bundle/release-bundle.json
          archive=.runtime/release-bundle/meow-app-images.tar
          checksums=.runtime/release-bundle/SHA256SUMS
          for file in "$manifest" "$archive" "$checksums"; do test -s "$file"; done
          (
            cd .runtime/release-bundle
            sha256sum --check --strict SHA256SUMS
          )
          test "$(sha256sum "$manifest" | awk '{print $1}')" = "${{ inputs.bundle_manifest_sha256 }}"
          test "$(sha256sum "$archive" | awk '{print $1}')" = "${{ inputs.bundle_archive_sha256 }}"
          node - "$manifest" "${{ inputs.backend_sha }}" "$(tr -d '[:space:]' < integration/frontend-ref.txt)" <<'NODE'
          const fs = require("node:fs");
          const [path, backendSha, frontendSha] = process.argv.slice(2);
          const j = JSON.parse(fs.readFileSync(path, "utf8"));
          if (j.schemaVersion !== "meow-release-bundle-v1") process.exit(1);
          if (j.backendSha !== backendSha || j.frontendSha !== frontendSha) process.exit(2);
          NODE

      - name: Authenticate to external registry
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$REGISTRY_USERNAME" || -z "$REGISTRY_PASSWORD" ]]; then
            echo 'MEOW_REGISTRY_USERNAME and MEOW_REGISTRY_PASSWORD secrets are required' >&2
            exit 1
          fi
          printf '%s' "$REGISTRY_PASSWORD" | docker login "${{ inputs.registry_host }}" \
            --username "$REGISTRY_USERNAME" --password-stdin

      - name: Promote exact retained bundle without rebuild
        env:
          MEOW_REGISTRY_HOST: ${{ inputs.registry_host }}
          MEOW_REGISTRY_NAMESPACE: ${{ inputs.registry_namespace }}
          MEOW_REGISTRY_EVIDENCE_PATH: .runtime/registry-promotion/external-evidence.json
        run: bash integration/promote-release-bundle.sh

      - name: Validate and summarize promotion evidence
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence=.runtime/registry-promotion/external-evidence.json
          test -s "$evidence"
          evidence_sha="$(sha256sum "$evidence" | awk '{print $1}')"
          node - "$evidence" "${{ inputs.backend_sha }}" "$(tr -d '[:space:]' < integration/frontend-ref.txt)" <<'NODE'
          const fs = require("node:fs");
          const [path, backendSha, frontendSha] = process.argv.slice(2);
          const j = JSON.parse(fs.readFileSync(path, "utf8"));
          const digest = /^sha256:[a-f0-9]{64}$/;
          if (j.schemaVersion !== "meow-registry-promotion-v1") process.exit(1);
          if (j.backendSha !== backendSha || j.frontendSha !== frontendSha) process.exit(2);
          if (!digest.test(j.images?.api?.digest ?? "") || !digest.test(j.images?.web?.digest ?? "")) process.exit(3);
          if (j.proof?.rebuilt !== false || j.proof?.pulledByDigest !== true || j.proof?.exactImageIdsPreserved !== true || j.proof?.hardenedSmokePassed !== true) process.exit(4);
          NODE
          echo "sha256=$evidence_sha" >> "$GITHUB_OUTPUT"
          {
            echo '## Meow external registry promotion'
            echo
            echo "Backend SHA: `${{ inputs.backend_sha }}`"
            echo "Bundle run: `${{ inputs.bundle_run_id }}`"
            echo "Evidence SHA-256: `$evidence_sha`"
            echo
            echo '```json'
            cat "$evidence"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish sanitized registry promotion evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meow-registry-promotion-${{ inputs.backend_sha }}
          path: .runtime/registry-promotion/external-evidence.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
