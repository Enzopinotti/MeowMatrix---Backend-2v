name: One-shot modern backend lock generation

on:
  push:
    branches:
      - feat/meow-2026-foundation-b1
    paths:
      - ".github/workflows/generate-modern-lock-once.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Check out branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feat/meow-2026-foundation-b1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc

      - name: Generate deterministic lock, canonicalize and qualify foundation
        working-directory: modern
        run: |
          set -euo pipefail
          # Retry after preserving Express error-handler arity with an explicit underscore-ignore lint rule.
          npm install --package-lock-only --ignore-scripts --audit=false --fund=false
          npm ci --ignore-scripts --audit=false --fund=false
          npm exec prettier -- --write .
          npm run check

      - name: Commit lock, canonical formatting and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modern
          git rm .github/workflows/generate-modern-lock-once.yml
          git commit -m "chore: qualify and lock modern backend foundation"
          git push origin HEAD:feat/meow-2026-foundation-b1
