name: Temporary B3 OpenAPI formatter

on:
  push:
    branches:
      - feat/modern-b3-auth-runtime

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: modern/package-lock.json

      - name: Install locked dependencies
        working-directory: modern
        run: npm ci --ignore-scripts

      - name: Format B3 regression
        working-directory: modern
        run: npm exec -- prettier --write test/openapi.regression.test.ts

      - name: Commit canonical formatter output
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add modern/test/openapi.regression.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: format B3 OpenAPI regression"
          git push origin HEAD:feat/modern-b3-auth-runtime
